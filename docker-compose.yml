services:
  postgres:
    image: postgres:15
    container_name: my_postgres
    ports:
      - "5432:5432"
    env_file:
      - ./apps/functional/.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
        -c pg_stat_statements.max=10000
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  app-functional:
    image: node:18
    container_name: mg_functional
    working_dir: /app
    command: bash -c "npm install && npm run dev:docker"
    volumes:
      - ./apps/functional:/app
      - /app/node_modules
      - ./database:/database
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - ./apps/functional/.env
    environment:
      MIGRATIONS_DIR: /database/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  app-oop:
    image: node:18
    container_name: mg_oop
    working_dir: /app
    command: bash -c "npm install && npm run dev:docker"
    volumes:
      - ./apps/oop:/app
      - /app/node_modules
      - ./database:/database
    ports:
      - "3001:3001"
    env_file:
      - ./apps/oop/.env
    environment:
      MIGRATIONS_DIR: /database/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
