services:
  postgres:
    image: postgres:15
    container_name: my_postgres
    ports:
      # Port hosta przemapowany z 5432 -> 55432, żeby nie kolidować z innymi
      # instancjami PostgreSQL działającymi na maszynie. Wewnątrz sieci compose
      # aplikacje łączą się nadal przez postgres:5432 (DB_HOST=postgres w .env).
      - "55432:5432"
    env_file:
      - ./apps/functional/.env
    environment:
      # UWAGA: Compose interpoluje ${...} ze środowiska powłoki i z pliku .env
      # w katalogu głównym projektu — NIE z `env_file` powyżej. Bez wartości
      # domyślnych Postgres odmawia inicjalizacji świeżego wolumenu
      # ("superuser password is not specified"). Wartości domyślne muszą
      # odpowiadać DB_* w apps/*/.env, inaczej aplikacje się nie połączą.
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
        -c pg_stat_statements.max=10000
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  app-functional:
    image: node:18
    container_name: mg_functional
    working_dir: /app
    command: >
      bash -c "npm install --no-audit --no-fund &&
               npm run build &&
               node dist/index.js"
    volumes:
      - ./apps/functional:/app
      - /app/node_modules
      - ./database:/database
    ports:
      # Port hosta 3100 -> 3000 w kontenerze (3000 bywa zajęty przez inne projekty)
      - "3100:${PORT:-3000}"
    env_file:
      - ./apps/functional/.env
    environment:
      MIGRATIONS_DIR: /database/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s

  app-oop:
    image: node:18
    container_name: mg_oop
    working_dir: /app
    command: >
      bash -c "npm install --no-audit --no-fund &&
               npm run build &&
               node dist/index.js"
    volumes:
      - ./apps/oop:/app
      - /app/node_modules
      - ./database:/database
    ports:
      - "3001:3001"
    env_file:
      - ./apps/oop/.env
    environment:
      MIGRATIONS_DIR: /database/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s

volumes:
  pgdata:
